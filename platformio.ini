[env:esp32-c6-super-mini]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_port = COM6
upload_port = COM6
upload_speed = 921600
board_build.cdc_on_boot = 1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  moononournation/GFX Library for Arduino @ ^1.5.0
